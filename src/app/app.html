<div class="app-container">
  <!-- Header -->
  <header class="app-header">
    <div class="header-logo">
      <span class="logo-emoji">🚀</span>
      <h1 class="logo-text">CamPulse</h1>
    </div>
    
    <div class="header-nav">
      <!-- Navigation items using routerLink and routerLinkActive -->
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">📊 Dashboard</a>
      <a routerLink="/portfolio" routerLinkActive="active" class="nav-link">💼 Portfolio</a>
      <a routerLink="/record-trade" routerLinkActive="active" class="nav-link">➕ Record Trade</a>
      <a routerLink="/history" routerLinkActive="active" class="nav-link">📜 History</a>
    </div>

    <div class="header-user">
      <!-- Google Sign In Button (shown when logged out) -->
      <ng-container *ngIf="apiService.isGuest()">
        <div id="googleBtn" style="display: inline-block; vertical-align: middle;"></div>
      </ng-container>

      <!-- Google Profile & Sign Out (shown when logged in) -->
      <ng-container *ngIf="!apiService.isGuest() && apiService.googleProfile()">
        <div class="profile-avatar-container">
          <button class="profile-avatar-btn" (click)="toggleProfileDropdown($event)">
            {{ getUserInitials() }}
          </button>
          
          <!-- Floating Profile Dropdown Card (Gemini style) -->
          <div class="profile-dropdown-card" *ngIf="showProfileDropdown" (click)="$event.stopPropagation()">
            <div class="profile-dropdown-header">
              <div class="large-avatar">{{ getUserInitials() }}</div>
              <div class="user-details">
                <span class="user-name">{{ apiService.googleProfile().name }}</span>
                <span class="user-email" *ngIf="apiService.googleProfile().email">{{ apiService.googleProfile().email }}</span>
                <span class="user-role-badge">Premium Trader</span>
              </div>
            </div>
            <div class="profile-dropdown-divider"></div>
            <div class="profile-dropdown-actions">
              <button class="signout-btn-modern" (click)="logoutGoogle(); closeProfileDropdown()">
                <span>🚪</span> Sign Out
              </button>
            </div>
          </div>
        </div>
      </ng-container>

      <button class="refresh-btn" (click)="refreshActivePage()" title="Refresh Data">🔄</button>
    </div>

    <!-- Dropdown Backdrop to close on click outside -->
    <div class="dropdown-backdrop" *ngIf="showProfileDropdown" (click)="closeProfileDropdown()"></div>
  </header>

  <!-- Body Content: Handles the router-outlet -->
  <main class="app-body">
    <router-outlet></router-outlet>
  </main>
</div>
