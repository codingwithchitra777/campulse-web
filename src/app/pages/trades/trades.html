<div class="page-container" style="max-width: 1000px; margin: 0 auto; padding: 20px;">
  <div class="header-section" style="margin-bottom: 24px;">
    <h1 class="page-title" style="font-size: 1.8rem; font-weight: 700; margin: 0 0 16px 0; color: var(--text-color);">
      {{ 'NAV.TRADES' | translate }}
    </h1>

    <!-- Tab Navigation -->
    <div class="tabs-container" style="display: flex; gap: 8px; border-bottom: 1px solid var(--border-color);">
      <a routerLink="/trades/record" 
         class="tab-link"
         [class.active]="activeTab === 'record'"
         style="padding: 12px 24px; font-weight: 600; font-size: 14px; text-decoration: none; color: var(--text-color); border-bottom: 3px solid transparent; transition: all 0.2s ease; opacity: 0.7;">
        {{ 'NAV.RECORD_TRADE' | translate }}
      </a>
      <a routerLink="/trades/history" 
         class="tab-link"
         [class.active]="activeTab === 'history'"
         style="padding: 12px 24px; font-weight: 600; font-size: 14px; text-decoration: none; color: var(--text-color); border-bottom: 3px solid transparent; transition: all 0.2s ease; opacity: 0.7;">
        {{ 'NAV.HISTORY' | translate }}
      </a>
    </div>
  </div>

  <style>
    .tab-link:hover {
      opacity: 1 !important;
      background: var(--bg-surface-hover);
      border-radius: 8px 8px 0 0;
    }
    .tab-link.active {
      opacity: 1 !important;
      border-bottom-color: var(--color-accent) !important;
      color: var(--color-accent) !important;
    }
  </style>

  <div class="tab-content" style="padding-top: 10px;">
    <router-outlet></router-outlet>
  </div>
</div>
